<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gream">
<meta name="theme-color" content="#2d5a1b">
<meta name="format-detection" content="telephone=no">
<title>Gream</title>
<script>
// Ukázka pro vývojářskou galerii (tools/greamici.html): ?demo=1 → hra běží nad kopií ukázkových dat v paměti
// (sessionStorage 'gream_demo'), skutečná data v zařízení se nečtou ani nemění. Bez parametru se nic neděje.
(function () {
  if (!/[?&]demo=1(&|$)/.test(location.search)) return;
  try {
    var m = new Map(Object.entries(JSON.parse(sessionStorage.getItem('gream_demo') || '{}')));
    var st = { getItem: function (k) { return m.has(k) ? m.get(k) : null; }, setItem: function (k, v) { m.set(k, String(v)); },
      removeItem: function (k) { m.delete(k); }, clear: function () { m.clear(); }, key: function (i) { return Array.from(m.keys())[i] || null; } };
    Object.defineProperty(st, 'length', { get: function () { return m.size; } });
    Object.defineProperty(window, 'localStorage', { value: st, configurable: true });
    window.__greamDemo = true;
  } catch (e) {}
})();
</script>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="icons/apple-touch-icon-120.png">
<link rel="apple-touch-icon" sizes="76x76" href="icons/apple-touch-icon-76.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/themes.css">
<!-- Mapa: MapLibre (lokálně, načte se až s mapou); dlaždice přes vlastní server -->
<link rel="preconnect" href="https://3rstudio.eu" crossorigin>
</head>
<body>

<!-- LOADING: oficiální logo + podtitul (do načtení hry) -->
<div id="appLoadingFallback" style="position:fixed;inset:0;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#cbe3a0;font-family:'Nunito','Helvetica',sans-serif;color:#1a3d0a;z-index:9999;padding:24px">
  <img src="img/logo/gream-logo.png" alt="Gream" width="300" height="140" style="width:min(300px,78vw);height:auto;animation:glogo 2.6s ease-in-out infinite">
  <div id="appLoadingSlogan" style="font-size:17px;font-weight:900;color:#2d5a1b;margin-top:14px;letter-spacing:.3px">Vylušti. Vylíhni. Vyraž ven.</div>
  <div id="appLoadingMsg" style="margin-top:22px;display:flex;gap:7px" aria-label="Loading"><i></i><i></i><i></i></div>
  <style>@keyframes glogo{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  #appLoadingMsg i{width:9px;height:9px;border-radius:50%;background:#4a8a2e;opacity:.35;animation:gdot 1s ease-in-out infinite}
  #appLoadingMsg i:nth-child(2){animation-delay:.15s}#appLoadingMsg i:nth-child(3){animation-delay:.3s}
  @keyframes gdot{50%{opacity:1;transform:translateY(-4px)}}</style>
  <script>try{if((localStorage.getItem('gream_lang')||(navigator.language||'').slice(0,2))!=='cs'){document.getElementById('appLoadingSlogan').textContent='Quiz. Hatch. Explore.'}}catch(e){}</script>
</div>

<noscript>
  <div style="position:fixed;inset:0;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#cbe3a0;font-family:'Nunito',sans-serif;color:#1a3d0a;text-align:center;padding:20px;z-index:9999">
    <img src="img/logo/gream-logo.png" alt="Gream" style="width:min(300px,78vw);height:auto;margin-bottom:10px">
    <p style="font-size:14px">JavaScript is required. Please enable it.</p>
    <p style="font-size:12px;opacity:0.7;margin-top:8px">JavaScript je nutný. Prosím povolte ho.</p>
  </div>
</noscript>

<!-- BACKGROUND -->
<div class="bg-nature" id="bgNature">
  <div class="sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="bf bf1">🦋</div>
  <div class="bf bf2">🦋</div>
  <div class="tree t1"><div class="top"></div><div class="trunk"></div></div>
  <div class="tree t2"><div class="top"></div><div class="trunk"></div></div>
  <div class="tree t3"><div class="top"></div><div class="trunk"></div></div>
  <div class="tree t4"><div class="top"></div><div class="trunk"></div></div>
</div>

<!-- LANG TOGGLE (pre-login) -->
<div class="lang-toggle hidden" id="gLangToggle">
  <button class="lang-btn" id="glEN" onclick="App.setLang('en')">EN</button>
  <button class="lang-btn" id="glCZ" onclick="App.setLang('cs')">CZ</button>
</div>

<!-- SCREEN CONTAINER — screens injected here -->
<div id="screenContainer"></div>

<!-- BOTTOM TAB BAR -->
<nav id="tabBar" class="tab-bar hidden">
  <button class="tab-btn" id="tab-garden" onclick="App.showTab('garden')">
    <span class="tab-icon" data-icon="garden"></span>
    <span class="tab-lbl" id="tabLblGarden"></span>
  </button>
  <button class="tab-btn" id="tab-map" onclick="App.showTab('map')">
    <span class="tab-icon" data-icon="map"></span>
    <span class="tab-lbl" id="tabLblMap"></span>
  </button>
  <button class="tab-btn" id="tab-hub" onclick="App.showTab('hub')">
    <span class="tab-icon" data-icon="me"></span>
    <span class="tab-lbl" id="tabLblHub"></span>
  </button>
</nav>

<script type="module" src="js/app.js"></script>
<script>
  // If module fails to load (Safari syntax error, CORS, etc.), show error after 4s
  // Hláška jen když se modul hry opravdu nenačetl (pomalý telefon ≠ chyba) – app.js hned na začátku nastaví __greamLoaded
  setTimeout(function() {
    if (window.__greamLoaded) return;
    var fallback = document.getElementById('appLoadingFallback');
    var msg = document.getElementById('appLoadingMsg');
    if (fallback && fallback.style.display !== 'none' && msg && msg.textContent === 'Loading...') {
      msg.innerHTML = '<div style="color:#c54a3d;font-weight:700;margin-bottom:6px">Failed to start</div>' +
        '<div style="font-size:10px;opacity:0.7;max-width:280px">JavaScript module did not run. ' +
        'This usually means a syntax error or your browser is too old.</div>' +
        '<div style="font-size:10px;opacity:0.7;margin-top:6px">' +
        'Check the browser console (Web Inspector) for errors.</div>' +
        '<button onclick="location.reload()" style="margin-top:12px;padding:8px 16px;border:none;border-radius:8px;background:#4a8a2e;color:white;font-weight:700;cursor:pointer">Reload</button>';
    }
  }, 10000);
</script>
</body>
</html>
