<header class="scr-header">
  <div class="scr-left"><button class="btn-back" onclick="App.back()" data-icon="back"></button></div>
  <h1 class="scr-title" id="wardTitle"></h1>
  <div class="scr-right"><div class="seed-pill">🌱 <span id="wardSeeds">0</span></div></div>
</header>

<div class="shop-tabs" role="tablist">
  <button class="ward-tab active"  data-tab="decor"   onclick="App.wardSwitchTab('decor')"><span>🏡</span><b data-l="shop_tab_decor"></b></button>
  <button class="ward-tab"        data-tab="bg"      onclick="App.wardSwitchTab('bg')"><span>🌄</span><b data-l="shop_tab_bg"></b></button>
  <button class="ward-tab"        data-tab="boosts"  onclick="App.wardSwitchTab('boosts')"><span>✨</span><b data-l="shop_tab_boosts"></b></button>
  <button class="ward-tab"        data-tab="avatars" onclick="App.wardSwitchTab('avatars')"><span>🎭</span><b data-l="shop_tab_avatars"></b></button>
  <button class="ward-tab"        data-tab="frames"  onclick="App.wardSwitchTab('frames')"><span>🖼️</span><b data-l="shop_tab_frames"></b></button>
</div>

<div id="wardGrid" style="max-width:420px;margin:0 auto"></div>
<div id="bgShopGrid" style="display:none"></div>
