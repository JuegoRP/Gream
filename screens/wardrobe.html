<header class="scr-header">
  <div class="scr-left"><button class="btn-back" onclick="App.back()" data-icon="back"></button></div>
  <h1 class="scr-title" id="wardTitle"></h1>
  <div class="scr-right"><div class="seed-pill">🌱 <span id="wardSeeds">0</span></div></div>
</header>

<div style="display:flex;gap:6px;margin:0 auto 14px;max-width:420px;padding:0 2px">
  <button class="ward-tab active" data-tab="greams"  id="wardTabGreams"  onclick="App.wardSwitchTab('greams')">🥚</button>
  <button class="ward-tab"        data-tab="boosts"  id="wardTabBoosts"  onclick="App.wardSwitchTab('boosts')">✨</button>
  <button class="ward-tab"        data-tab="avatars" id="wardTabAvatars" onclick="App.wardSwitchTab('avatars')">🎭</button>
  <button class="ward-tab"        data-tab="frames"  id="wardTabFrames"  onclick="App.wardSwitchTab('frames')">🖼️</button>
  <button class="ward-tab"        data-tab="bg"      id="wardTabBg"      onclick="App.wardSwitchTab('bg')">🌄</button>
</div>

<div id="wardGrid" style="max-width:420px;margin:0 auto"></div>
<div id="bgShopGrid" style="display:none"></div>
