<header class="scr-header">
  <div class="scr-left"><button class="btn-back" onclick="App.back()" data-icon="back"></button></div>
  <h1 class="scr-title" id="rankTitle"></h1>
  <div class="scr-right"></div>
</header>

<!-- Own card -->
<div id="rankOwnCard" style="max-width:420px;margin:0 auto 16px"></div>

<!-- Tabs -->
<div class="seg" role="tablist">
  <button id="rankTabLocal" onclick="App.rankSwitchTab('local')" class="seg-btn active" role="tab"></button>
  <button id="rankTabGlobal" onclick="App.rankSwitchTab('global')" class="seg-btn" role="tab"></button>
</div>

<div id="rankList" style="max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:8px"></div>
