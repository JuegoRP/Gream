<header class="scr-header">
  <div class="scr-left"><button class="btn-back" onclick="App.back()" data-icon="back"></button></div>
  <h1 class="scr-title" id="rankTitle"></h1>
  <div class="scr-right"></div>
</header>

<!-- Own card -->
<div id="rankOwnCard" style="max-width:420px;margin:0 auto 16px"></div>

<!-- Tabs -->
<div class="seg" role="tablist">

  <button id="rankTabDaily" onclick="App.rankSwitchTab('daily')" class="seg-btn" role="tab"></button>
  <button id="rankTabCollection" onclick="App.rankSwitchTab('collection')" class="seg-btn" role="tab"></button>
</div>

<div id="rankList" class="rk-list"></div>
